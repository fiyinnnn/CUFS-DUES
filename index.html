<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUFS Dues</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f9d55">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e2e2dc;--green:#1f9d55;--red:#d64545;--blue:#2f6fd6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--text:#f0f0ec;--muted:#9a9a94;--line:#363633}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.ed{background:var(--green);color:#fff}
.row{display:flex;gap:8px;margin-bottom:10px}
select,input,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
select,input{flex:1;min-width:0}button{cursor:pointer}
.sum{display:flex;gap:8px;margin:10px 0}
.pill{flex:1;text-align:center;border-radius:10px;padding:8px 4px;color:#fff;font-size:13px}.pill b{display:block;font-size:20px}
.g{background:var(--green)}.r{background:var(--red)}.b{background:var(--blue)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:8px solid;border-radius:12px;padding:12px;margin-bottom:8px}
.item.g{border-left-color:var(--green)}.item.r{border-left-color:var(--red)}.item.b{border-left-color:var(--blue)}
.tick{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.item.g .tick{background:var(--green)}.item.r .tick{background:var(--red)}.item.b .tick{background:var(--blue)}
.ed .tick{cursor:pointer}
.mid{flex:1;min-width:0}.name{font-weight:500}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:6px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.sub input{padding:4px 8px;font-size:12px;flex:none;width:auto}
.x{border:none;background:none;color:var(--muted);padding:4px 8px}
.hint,.note{font-size:12px;color:var(--muted);margin:8px 0}
.warn{background:#fff3cd;color:#664d03;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px}
.panel{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.panel h2{font-size:15px;margin:0 0 8px}
.er{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.hide{display:none}
</style></head><body>
<div class="top"><h1>CUFS Executives Dues</h1><span id="badge" class="badge">Viewing</span></div>
<div id="warn" class="warn hide"></div>
<div id="who" class="hint"></div>
<div class="row"><select id="month"></select><button id="newMonth" class="eo">+ Month</button><button id="sign">Sign in</button></div>
<div class="sum"><div class="pill g"><b id="cg">0</b>Paid</div><div class="pill r"><b id="cr">0</b>Default</div><div class="pill b"><b id="cb">0</b>Unable</div></div>
<div id="hint" class="hint"></div>
<div id="list"></div>
<div class="row eo"><input id="nn" placeholder="Name"><input id="np" placeholder="Position"><button id="add">Add</button></div>
<div class="row"><button id="copy" style="flex:1">Copy summary</button><button id="imp" class="eo owner" style="flex:1">Import old backup</button></div>
<div id="own" class="panel hide"><h2>Editors</h2><div id="elist"></div>
